name: Pre-breakout scan

on:
  schedule:
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Kaunsa data scan karna hai"
        type: choice
        default: nse+bse
        options:
          - nse+bse
          - nse

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore bhavcopy cache
        uses: actions/cache@v4
        with:
          path: cache/bhav
          key: bhav-${{ github.run_id }}
          restore-keys: bhav-

      - name: Run scanner (bhavcopy)
        run: |
          if [ "${{ inputs.universe }}" = "nse" ]; then
            python scanner.py --bhavcopy
          else
            python scanner.py --bhavcopy --bse
          fi

      - name: Commit updated data
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add site/data.js site/data.json
          git diff --staged --quiet || git commit -m "Scan update"
          git push

      - name: Upload to GoogieHost via FTP
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_DIR || '/public_html/' }}
          exclude: |
            **/refresh_config.sample.phpname: Pre-breakout scan

